      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /clever-miner/api:
    post:
      operationId: clever_miner_api_create
      description: Create the Todo with given todo data
      tags:
      - clever-miner
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Todo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Todo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Todo'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /clever-miner/dataset:
    post:
      operationId: clever_miner_dataset_create
      tags:
      - clever-miner
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/DataSet'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
components:
  schemas:
    DataSet:
      type: object
      properties:
        delimiter:
          type: string
          maxLength: 32
        file:
          type: string
          format: uri
        user:
          type: integer
          nullable: true
      required:
      - delimiter
      - file
    Todo:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
      required:
      - created_at
      - title
      - updated_at
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
